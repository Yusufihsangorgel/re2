name: re2
description: >-
  Linear-time regular expressions for Dart via Google's RE2 over FFI. Immune to
  catastrophic backtracking (ReDoS).
version: 1.1.3
repository: https://github.com/Yusufihsangorgel/re2
issue_tracker: https://github.com/Yusufihsangorgel/re2/issues

topics:
  - regex
  - re2
  - security
  - ffi
  - performance

screenshots:
  - description: "Time to match (a+)+$ against a non-matching string, log scale: the dart:core line doubles every two characters and reaches 2.9 seconds at 28, while re2 stays flat near 27 microseconds."
    path: doc/redos.png
  - description: >-
      Why re2 stays linear: a backtracking engine tries 2^(n-1) ways to split
      the input, while RE2 makes one left-to-right pass over a state machine.
    path: doc/mechanism.png

  - description: >-
      A log-scale chart of the same run: dart:core climbs five decades from
      4 ms to 5.7 s while re2 stays flat at a microsecond.
    path: doc/redos-curve.png
environment:
  sdk: ^3.10.0

dependencies:
  code_assets: ^1.2.1
  ffi: ^2.1.0
  hooks: '>=2.0.2 <3.0.0'
  native_toolchain_c: '>=0.19.2 <0.20.0'

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
